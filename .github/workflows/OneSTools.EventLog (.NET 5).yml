name: EventLog .NET 5

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Setup .NET
      id: dotnet
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: 8.0.x
    # Select the installed SDK even if the runner has a newer one preinstalled.
    # This file exists only in CI; production target frameworks stay unchanged.
    - name: Select build SDK
      run: dotnet new globaljson --sdk-version '${{ steps.dotnet.outputs.dotnet-version }}' --roll-forward latestPatch
    - name: Install dependencies
      run: dotnet restore OneSTools.EventLog.Tests/OneSTools.EventLog.Tests.csproj
    - name: Build
      run: dotnet build OneSTools.EventLog.Tests/OneSTools.EventLog.Tests.csproj --configuration Release --no-restore
    - name: Test
      run: dotnet test OneSTools.EventLog.Tests/OneSTools.EventLog.Tests.csproj --configuration Release --no-build --verbosity normal
